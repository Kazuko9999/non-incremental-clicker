<body>
<button onclick="kattintas()">kattintas</button>
<button onclick="mentes()">mentés</button>
<button onclick="betoltes()">betöltés</button>
<br> <!--asdasdasdasd-->
<button onclick="setAutoSave(event)">autosave off</button>
<span>0</span>

    <script defer>
       /* let diak = {
            name: "diák-neve",
            class:"osztálya",
            age:"kora",
        };*/
        let score = 0
        const counter = document.querySelector("span")
        function kattintas(){
            score ++;
            counter.innerHTML = score
            if (localStorage.getItem("autosave").includes("on")){
                mentes()
            }
            console.log(localStorage.getItem("score"))
        }
        function mentes(){
            localStorage.setItem("score",score)
        }
        function betoltes(){
            score = localStorage.getItem("score")
            counter.innerHTML = score
        }
        function setAutoSave(event){
            let state = localStorage.getItem("autosave")
            if (state.includes("off")){
                localStorage.setItem("autosave", "on")
                event.currentTarget.innerHTML = "autosave on"

            }
            else if (state.includes("on")){
                localStorage.setItem("autosave", "off")
                event.currentTarget.innerHTML = "autosave off"
            }
        }


    </script>
</body>
